<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Till · Concept 1 — Ember</title>
<link rel="icon" href="/assets/logo.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0b0d12; --s1: #12151c; --s2: #191d26; --s3: #212632;
    --line: rgba(255,255,255,.07); --line2: rgba(255,255,255,.12);
    --fg: #f4f6f8; --fg2: #aab2c0; --fg3: #6f7a8b;
    --acc: #ff5c38; --acc2: #ff9838; --acc-ink: #1a0b06;
    --ok: #34d399; --warn: #fbbf24;
    --kitchen: #ffb020; --grill: #ff4d4d; --snacks: #a3e635; --drinks: #38bdf8;
    --r: 16px; --sans: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 var(--sans); -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; overflow: hidden; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  input { font: inherit; color: inherit; }
  img { display: block; }
  ::-webkit-scrollbar { width: 0; height: 0; }

  .app { display: grid; grid-template-columns: 76px 1fr 408px; grid-template-rows: 100dvh; height: 100dvh; }

  /* ---------------------------------------------------------- rail */
  .rail { background: var(--s1); border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; padding: 14px 0 16px; gap: 6px; }
  .logo { width: 44px; height: 44px; border-radius: 14px; background: linear-gradient(135deg, var(--acc), var(--acc2)); display: grid; place-items: center; font-weight: 800; font-size: 15px; letter-spacing: -.02em; color: var(--acc-ink); margin-bottom: 14px; box-shadow: 0 8px 24px -8px rgba(255,92,56,.7); }
  .nav { display: flex; flex-direction: column; gap: 6px; width: 100%; padding: 0 12px; }
  .nav button { position: relative; height: 52px; border-radius: 14px; display: grid; place-items: center; color: var(--fg3); transition: background .15s, color .15s; }
  .nav button:hover { background: var(--s2); color: var(--fg2); }
  .nav button.is-active { background: var(--s3); color: var(--fg); box-shadow: inset 0 0 0 1px var(--line2); }
  .nav button.is-active::before { content: ""; position: absolute; left: -12px; top: 14px; bottom: 14px; width: 3px; border-radius: 3px; background: var(--acc); }
  .nav svg { width: 22px; height: 22px; }
  .nav .n { position: absolute; top: 8px; right: 8px; min-width: 18px; height: 18px; border-radius: 9px; background: var(--acc); color: var(--acc-ink); font-size: 11px; font-weight: 800; display: grid; place-items: center; padding: 0 5px; }
  .rail-foot { margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #7c3aed, #ec4899); display: grid; place-items: center; font-weight: 700; font-size: 13px; }
  .online { width: 10px; height: 10px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 4px rgba(52,211,153,.15); }

  /* ---------------------------------------------------------- main */
  .main { display: grid; grid-template-rows: auto auto auto 1fr; min-width: 0; }
  .top { display: flex; align-items: center; gap: 16px; padding: 16px 24px 8px; }
  .tablechip { display: flex; align-items: center; gap: 12px; padding: 8px 14px 8px 8px; border-radius: 999px; background: var(--s2); border: 1px solid var(--line); }
  .tablechip b { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, var(--acc), var(--acc2)); color: var(--acc-ink); display: grid; place-items: center; font-weight: 800; font-size: 15px; }
  .tablechip span { display: block; font-weight: 700; font-size: 15px; letter-spacing: -.01em; }
  .tablechip small { display: block; color: var(--fg3); font-size: 12px; margin-top: 1px; }
  .search { flex: 1; max-width: 520px; display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 16px; border-radius: 14px; background: var(--s1); border: 1px solid var(--line); color: var(--fg3); }
  .search:focus-within { border-color: var(--line2); background: var(--s2); }
  .search input { flex: 1; background: none; border: 0; outline: 0; font-size: 15px; color: var(--fg); }
  .search input::placeholder { color: var(--fg3); }
  .search kbd { font: 600 11px/1 var(--sans); color: var(--fg3); border: 1px solid var(--line2); border-radius: 6px; padding: 4px 6px; }
  .top-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .pill { height: 40px; padding: 0 14px; border-radius: 12px; background: var(--s1); border: 1px solid var(--line); display: inline-flex; align-items: center; gap: 8px; color: var(--fg2); font-weight: 600; font-size: 13px; }
  .pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
  .clock { font-weight: 700; font-size: 15px; color: var(--fg2); letter-spacing: .01em; padding: 0 6px; }

  .tables { display: flex; gap: 8px; padding: 8px 24px 4px; overflow-x: auto; }
  .tbl { flex: 0 0 auto; min-width: 74px; height: 56px; border-radius: 14px; background: var(--s1); border: 1px solid var(--line); display: flex; flex-direction: column; align-items: flex-start; justify-content: center; padding: 0 12px; gap: 1px; transition: transform .12s, background .15s; }
  .tbl:hover { background: var(--s2); }
  .tbl:active { transform: scale(.97); }
  .tbl b { font-weight: 800; font-size: 15px; letter-spacing: -.01em; }
  .tbl small { font-size: 11px; color: var(--fg3); font-weight: 500; }
  .tbl.is-open { border-color: rgba(255,176,32,.35); }
  .tbl.is-open small { color: var(--kitchen); }
  .tbl.is-reserved small { color: #c084fc; }
  .tbl.is-cleaning { opacity: .55; }
  .tbl.is-current { background: var(--fg); color: var(--bg); border-color: transparent; }
  .tbl.is-current small { color: #4b5563; }

  .cats { display: flex; align-items: center; gap: 8px; padding: 12px 24px 14px; border-bottom: 1px solid var(--line); }
  .cat { height: 42px; padding: 0 16px 0 12px; border-radius: 999px; background: var(--s1); border: 1px solid var(--line); display: inline-flex; align-items: center; gap: 9px; font-weight: 600; font-size: 14px; color: var(--fg2); transition: background .15s, transform .12s; }
  .cat:hover { background: var(--s2); }
  .cat:active { transform: scale(.97); }
  .cat .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 22%, transparent); }
  .cat .cat-n { font-style: normal; color: var(--fg3); font-size: 12px; font-weight: 600; }
  .cat.is-active { background: var(--fg); color: var(--bg); border-color: transparent; }
  .cat.is-active .cat-n { color: #4b5563; }
  [data-color="kitchen"] { --c: var(--kitchen); } [data-color="grill"] { --c: var(--grill); } [data-color="snacks"] { --c: var(--snacks); } [data-color="drinks"] { --c: var(--drinks); } [data-color="all"] { --c: var(--fg2); }
  .cats .meta { margin-left: auto; color: var(--fg3); font-size: 13px; font-weight: 500; }

  .grid { overflow-y: auto; padding: 20px 24px 40px; display: grid; grid-template-columns: repeat(auto-fill, minmax(196px, 1fr)); gap: 14px; align-content: start; }
  .tile { position: relative; display: flex; flex-direction: column; text-align: left; border-radius: var(--r); background: var(--s1); border: 1px solid var(--line); overflow: hidden; transition: transform .15s cubic-bezier(.2,.7,.2,1), border-color .15s, box-shadow .15s; }
  .tile:hover { transform: translateY(-2px); border-color: var(--line2); box-shadow: 0 16px 40px -20px rgba(0,0,0,.9); }
  .tile:active { transform: scale(.98); }
  .tile.pop .tile-badge { animation: pop .35s cubic-bezier(.2,.7,.2,1); }
  @keyframes pop { 0% { transform: scale(.6); } 60% { transform: scale(1.2); } 100% { transform: scale(1); } }
  .tile-img { position: relative; aspect-ratio: 4 / 3; overflow: hidden; }
  .tile-img img { width: 100%; height: 100%; object-fit: cover; transition: transform .4s cubic-bezier(.2,.7,.2,1); }
  .tile:hover .tile-img img { transform: scale(1.04); }
  .tile-img::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 55%, rgba(11,13,18,.55) 100%); }
  .tile-cat { position: absolute; left: 10px; top: 10px; z-index: 1; font-size: 10px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: #0b0d12; background: var(--c); padding: 4px 7px; border-radius: 6px; }
  .tile-mins { position: absolute; left: 10px; bottom: 10px; z-index: 1; font-size: 11px; font-weight: 600; color: #fff; background: rgba(11,13,18,.55); backdrop-filter: blur(6px); padding: 3px 7px; border-radius: 6px; }
  .tile-badge { position: absolute; right: 10px; top: 10px; z-index: 1; min-width: 26px; height: 26px; border-radius: 13px; background: linear-gradient(135deg, var(--acc), var(--acc2)); color: var(--acc-ink); font-weight: 800; font-size: 13px; display: none; place-items: center; padding: 0 8px; box-shadow: 0 6px 16px -6px rgba(255,92,56,.8); }
  .tile.in-order .tile-badge { display: grid; }
  .tile.in-order { border-color: rgba(255,120,80,.45); }
  .tile-body { display: flex; flex-direction: column; gap: 3px; padding: 12px 14px 14px; }
  .tile-name { font-weight: 700; font-size: 15px; letter-spacing: -.01em; line-height: 1.25; }
  .tile-desc { color: var(--fg3); font-size: 12px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
  .tile-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
  .tile-price { font-weight: 800; font-size: 17px; letter-spacing: -.02em; }
  .tile-price small { font-size: 11px; font-weight: 600; color: var(--fg3); margin-right: 3px; vertical-align: 2px; }
  .tile-add { height: 30px; padding: 0 12px; border-radius: 10px; background: var(--s3); font-weight: 700; font-size: 12px; display: inline-flex; align-items: center; color: var(--fg2); }
  .tile.in-order .tile-add { background: rgba(255,92,56,.15); color: #ffb49c; }
  .empty { color: var(--fg3); grid-column: 1 / -1; padding: 40px 0; text-align: center; font-size: 15px; }

  /* ---------------------------------------------------------- ticket */
  .ticket { background: var(--s1); border-left: 1px solid var(--line); display: grid; grid-template-rows: auto 1fr auto; min-height: 0; }
  .t-head { padding: 18px 20px 12px; border-bottom: 1px solid var(--line); }
  .t-head-row { display: flex; align-items: center; justify-content: space-between; }
  .t-title { font-weight: 800; font-size: 20px; letter-spacing: -.02em; }
  .t-sub { color: var(--fg3); font-size: 12px; margin-top: 3px; font-weight: 500; }
  .seg { display: inline-flex; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 2px; }
  .seg button { height: 28px; padding: 0 10px; border-radius: 7px; font-size: 12px; font-weight: 700; color: var(--fg3); }
  .seg button.is-active { background: var(--s3); color: var(--fg); }
  .lines { list-style: none; margin: 0; padding: 6px 12px; overflow-y: auto; }
  .line { display: grid; grid-template-columns: 34px 1fr auto; column-gap: 12px; align-items: center; padding: 10px 8px; border-radius: 12px; position: relative; }
  .line:hover { background: var(--s2); }
  .line-qty { width: 34px; height: 34px; border-radius: 10px; background: var(--s3); display: grid; place-items: center; font-weight: 800; font-size: 14px; }
  .line.is-new .line-qty { background: rgba(255,92,56,.18); color: #ffb49c; box-shadow: inset 0 0 0 1px rgba(255,92,56,.4); }
  .line-name { display: block; font-weight: 600; font-size: 14px; letter-spacing: -.01em; line-height: 1.2; }
  .line-meta { display: flex; gap: 8px; align-items: center; margin-top: 3px; font-size: 11.5px; }
  .line-note { color: var(--warn); font-weight: 600; }
  .line-note::before { content: "✎ "; }
  .line-addnote { color: var(--fg3); font-weight: 500; }
  .line-addnote:hover { color: var(--fg2); text-decoration: underline; }
  .line-state { color: var(--fg3); font-weight: 600; }
  .line-state.is-new { color: var(--acc2); }
  .line-price { font-weight: 700; font-size: 14px; }
  .stepper { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); display: none; gap: 4px; background: var(--s3); padding: 3px; border-radius: 10px; box-shadow: 0 10px 24px -10px rgba(0,0,0,.8); }
  .line:hover .stepper { display: flex; }
  .stepper button { width: 32px; height: 32px; border-radius: 8px; font-size: 18px; font-weight: 700; background: var(--s1); }
  .stepper button:hover { background: var(--fg); color: var(--bg); }
  .line-empty { color: var(--fg3); padding: 32px 10px; text-align: center; }
  .t-foot { padding: 12px 16px 16px; border-top: 1px solid var(--line); background: var(--s1); }
  .totals { margin: 0 4px 8px; display: flex; flex-direction: column; gap: 6px; }
  .tot { display: flex; justify-content: space-between; color: var(--fg2); font-size: 13px; }
  .tot dd, .tot dt { margin: 0; }
  .tot-grand { margin-top: 6px; padding-top: 10px; border-top: 1px dashed var(--line2); align-items: baseline; color: var(--fg); }
  .tot-grand dt { font-weight: 700; font-size: 14px; }
  .tot-grand dd { font-weight: 800; font-size: 30px; letter-spacing: -.03em; }
  .tot-grand dd small { font-size: 13px; color: var(--fg3); font-weight: 700; margin-right: 4px; vertical-align: 10px; letter-spacing: 0; }
  .t-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
  .ghost { height: 44px; border-radius: 12px; background: var(--s2); border: 1px solid var(--line); font-weight: 700; font-size: 13px; color: var(--fg2); display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
  .ghost:hover:not(:disabled) { background: var(--s3); color: var(--fg); }
  .ghost .n { min-width: 20px; height: 20px; border-radius: 10px; background: var(--acc); color: var(--acc-ink); font-size: 11px; font-weight: 800; display: grid; place-items: center; padding: 0 6px; }
  .tenders { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 8px; }
  .tenders button { height: 58px; border-radius: 14px; background: var(--s2); border: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-weight: 700; font-size: 12px; color: var(--fg2); }
  .tenders button:hover { background: var(--s3); color: var(--fg); border-color: var(--line2); }
  .tenders svg { width: 20px; height: 20px; }
  .charge { width: 100%; height: 60px; border-radius: 16px; background: linear-gradient(135deg, var(--acc), var(--acc2)); color: var(--acc-ink); font-weight: 800; font-size: 17px; letter-spacing: -.01em; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; box-shadow: 0 16px 40px -14px rgba(255,120,56,.8); transition: transform .12s, filter .15s; }
  .charge:hover { filter: brightness(1.05); }
  .charge:active { transform: scale(.985); }
  .charge span:last-child { font-size: 19px; }

  /* ---------------------------------------------------------- pay */
  .pay { position: fixed; inset: 0; z-index: 50; background: rgba(5,6,10,.7); backdrop-filter: blur(8px); display: grid; place-items: center; padding: 24px; }
  .pay[hidden] { display: none; }
  .pay-card { width: 520px; max-width: 100%; max-height: 100%; overflow: auto; background: var(--s1); border: 1px solid var(--line2); border-radius: 24px; box-shadow: 0 40px 100px -30px rgba(0,0,0,.9); animation: rise .25s cubic-bezier(.2,.7,.2,1); }
  @keyframes rise { from { transform: translateY(16px) scale(.98); opacity: 0; } }
  .pay-head { display: flex; justify-content: space-between; align-items: flex-start; padding: 22px 22px 14px; }
  .pay-kicker { color: var(--fg3); font-size: 12px; font-weight: 600; }
  .pay-total { margin: 4px 0 0; font-weight: 800; font-size: 40px; letter-spacing: -.03em; }
  .pay-close { width: 36px; height: 36px; border-radius: 10px; background: var(--s2); color: var(--fg2); font-size: 14px; }
  .pay-tenders { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 0 22px; }
  .tender { height: 54px; border-radius: 14px; background: var(--s2); border: 1px solid var(--line); font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--fg2); }
  .tender.is-active { background: var(--fg); color: var(--bg); border-color: transparent; }
  .tender-ic { width: 10px; height: 10px; border-radius: 50%; }
  .tender-cash { background: var(--ok); } .tender-momo { background: var(--kitchen); } .tender-split { background: var(--drinks); }
  .pay-body { padding: 16px 22px 6px; display: flex; flex-direction: column; gap: 14px; }
  .pay-amount { display: grid; grid-template-columns: 1fr auto; align-items: center; padding: 14px 18px; border-radius: 16px; background: var(--bg); border: 1px solid var(--line); }
  .pay-amount-label { color: var(--fg3); font-size: 12px; font-weight: 600; grid-column: 1; }
  .pay-amount-value { font-weight: 800; font-size: 32px; letter-spacing: -.03em; grid-column: 1; }
  .pay-change { grid-column: 2; grid-row: 1 / span 2; text-align: right; color: var(--fg2); font-size: 13px; }
  .pay-change b { display: block; color: var(--ok); font-size: 20px; font-weight: 800; letter-spacing: -.02em; }
  .pay-amount.is-short .pay-change b { color: var(--acc); }
  .pay-quick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .pay-quick button { height: 44px; border-radius: 12px; background: var(--s2); border: 1px solid var(--line); font-weight: 700; }
  .pay-quick button:hover { background: var(--s3); }
  .pay-keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .pay-keys button { height: 56px; border-radius: 14px; background: var(--s2); font-weight: 700; font-size: 20px; border: 1px solid var(--line); }
  .pay-keys button:hover { background: var(--s3); }
  .pay-keys button:active { transform: scale(.97); }
  .pay-networks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .net { height: 52px; border-radius: 14px; background: var(--s2); border: 1px solid var(--line); font-weight: 800; }
  .net.is-active { background: var(--fg); color: var(--bg); }
  .net-mtn.is-active { background: #ffcc00; color: #1a1a1a; } .net-telecel.is-active { background: #e30613; color: #fff; } .net-airteltigo.is-active { background: #1d4ed8; color: #fff; }
  .pay-field { display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600; color: var(--fg3); }
  .pay-field input { height: 52px; border-radius: 14px; background: var(--bg); border: 1px solid var(--line2); padding: 0 16px; font-size: 20px; font-weight: 700; outline: 0; }
  .pay-field input:focus { border-color: var(--acc); }
  .pay-hint { margin: 0; color: var(--fg3); font-size: 12.5px; }
  .pay-split { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: end; }
  .pay-split-rest { height: 52px; border-radius: 14px; background: var(--s2); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; font-size: 12px; color: var(--fg3); font-weight: 600; }
  .pay-split-rest b { color: var(--fg); font-size: 18px; font-weight: 800; }
  .pay-foot { display: grid; grid-template-columns: 110px 1fr; gap: 8px; padding: 14px 22px 22px; }
  .pay-secondary { height: 56px; border-radius: 14px; background: var(--s2); font-weight: 700; }
  .pay-confirm { height: 56px; border-radius: 14px; background: linear-gradient(135deg, var(--acc), var(--acc2)); color: var(--acc-ink); font-weight: 800; font-size: 15px; box-shadow: 0 16px 40px -14px rgba(255,120,56,.8); }

  .toast { position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px); opacity: 0; z-index: 60; background: var(--fg); color: var(--bg); font-weight: 700; font-size: 14px; padding: 14px 20px; border-radius: 14px; box-shadow: 0 20px 50px -20px rgba(0,0,0,.8); transition: transform .25s cubic-bezier(.2,.7,.2,1), opacity .25s; pointer-events: none; }
  .toast.is-on { transform: translate(-50%, 0); opacity: 1; }
  .toast[data-tone="info"] { background: var(--s3); color: var(--fg); }
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="logo">LV</div>
    <nav class="nav" aria-label="Areas">
      <button type="button" class="is-active" title="Till"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M7 20h10M12 16v4"/></svg></button>
